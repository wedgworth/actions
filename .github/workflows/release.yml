name: Shared AppPack Release
on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
        description: "AppPack app name"
      aws-region:
        required: false
        type: string
        default: "us-east-1"
        description: "AWS region"
    secrets:
      CR_UN:
        required: true
      CR_PAT:
        required: true
      APPPACK_ROLE_ARN:
        required: true

jobs:
  release:
    name: Release
    permissions:
      id-token: write
      contents: read
      actions: read
    # A local reference keeps this wrapper and deploy.yml on the same commit/tag.
    uses: ./.github/workflows/deploy.yml
    with:
      app-name: ${{ inputs.app-name }}
      aws-region: ${{ inputs.aws-region }}
      # An unbuilt commit has no sha tag, so pulling it fails the release.
      image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      promote-release: true
    secrets:
      CR_UN: ${{ secrets.CR_UN }}
      CR_PAT: ${{ secrets.CR_PAT }}
      APPPACK_ROLE_ARN: ${{ secrets.APPPACK_ROLE_ARN }}
